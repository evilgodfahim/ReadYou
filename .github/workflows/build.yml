name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Show SHA
        run: echo "Build SHA ${{ github.sha }}"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Setup Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring keystore from repository debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug --build-cache --parallel
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReadYou-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReadYou-Build-${{ github.sha }}
          path: app/build/outputs/apk/debug/ReadYou-${{ github.sha }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build compiled from commit ${{ github.sha }}."
          prerelease: false
          files: app/build/outputs/apk/debug/ReadYou-${{ github.sha }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

