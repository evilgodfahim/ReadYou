name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Show SHA
        run: echo "Build SHA ${{ github.sha }}"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReadYou-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReadYou-Build-${{ github.sha }}
          path: app/build/outputs/apk/debug/ReadYou-${{ github.sha }}.apk
